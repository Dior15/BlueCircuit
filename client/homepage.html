<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MovieFlix</title>
        <link rel="stylesheet" href="style.css">
        <link href="trending-carousel-temp.css" rel="stylesheet">
    </head>

    <body>
        <header>
            <div id="web-name">MovieFlix</div>
            <div class="search-bar"><input id="search-bar" type="text" placeholder="Search for a movie"></div>
            <button class="signin" id="signin-header">Sign In</button>
        </header>

        <br><br><br>
        <h3>Popular Movies this Week</h3>
        <div id="trendingCarousel">
  
          <button id="carouselLeftButton"><b><</b></button> 
        
          <div class="movieElement trendingCarouselSide" id="trendingCarouselLeft">
            <p>Movie Title</p>
          </div>
        
          <div class="movieElement" id="trendingCarouselMain">
            <p>Movie Title</p>
          </div>
        
          <div class="movieElement trendingCarouselSide" id="trendingCarouselRight">
            <p>Movie Title</p>
          </div>
        
          <button id="carouselRightButton"><b>></b></button>
            
        </div>
         
        <br><br><br><br>
  
        <div id="lower-section">
          
          <h3>Top Rated Movie this Week</h3><h3>What's New?</h3>
          <div class="movieElement bottom" id="top-rated">

          </div> 
          <div class="movieElement bottom" id="whats-new">

          </div>

        </div>
        
        <br><br><br><br>
        <h3>Already a user or new to the site?</h3>
        <div id="signin-or-up">
            <button class="signin" id="lower">Sign in</button>or <button class="signup" id="lower">Sign up</button>
        </div>
        
        <footer>

        </footer>
    </body>
    <script src = "trending-carousel-temp.js"></script>
</html>
