<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MovieFlix</title>
        <link rel="stylesheet" href="{{ url_for('static', filename ='style.css')}}">
        <link rel="stylesheet" href="{{ url_for('static', filename='moviepagestyle.css')}}">
    </head>

    <body>
      <header>
        <div id="web-name"><a href="{{ url_for('home')}}">MovieFlix</a></div>

          <div id="searchItems">
            <form action="/search" method="POST" id="search-bar">
                <input type="text" id="query" name="query" placeholder="Enter a search" required style="width: 500px;">

                <select id="category" name="category">
                    <option value="movie">Movie</option>
                    <option value="tv">TV Show</option>
                    <option value="person">Person</option>
                </select>

                <button type="submit" id="searchButton">Search</button>
            </form>
          </div>

          <div class="is-flex" id="user-section">
              <button class="signin header-buttons" id="signin-header">Sign In</button>
          </div>
         
          
      </header>
        
      <div class="is-flex">
        <div class="movie-poster"><img src="{{ poster_url }}" alt="{{ title }}"></div>
        <div id="movie-info">

          <h1 class="movie-title">{{ title }}</h1>
        
          <br>

          <div class="is-flex spaced-between">
            <div class="genre">{{ genres | join(', ') }}</div>
          </div>

          <br>
          
          <div class="">
            <p>Release Date: {{ releaseDate if releaseDate else "Unknown" }}</p>
            <br>
            <p>Runtime: {{ runtime if runtime else "Unknown"}} minutes</p>
            <br>
            <p>Director: {{ director if director else "Unknown"}}</p>
            <br>
            <p>Cast: {{ cast | join(', ') }}</p>
            <br>
            <p>Synopsis: {{ synopsis or "N/A"}}</p>
          </div>
            
        </div>
      </div>

      <script src="{{ url_for('static', filename='logoutFunctionality.js')}}"></script>

    </body>
</html>
