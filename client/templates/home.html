<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MovieFlix</title>
        <link rel="stylesheet" href="{{ url_for('static', filename ='style.css')}}">
        <link rel="stylesheet" href="{{ url_for('static', filename='trending-carousel.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='modal.css') }}">
    </head>

    <body>
        <header>
            <div id="web-name">MovieFlix</div>

            <div id="searchItems">
              <form action="/search" method="POST" id="search-bar">
                  <input type="text" id="query" name="query" placeholder="Search" required style="width: 500px;">

                  <select id="category" name="category">
                      <option value="movie">Movie</option>
                      <option value="tv">TV Show</option>
                      <option value="person">Person</option>
                  </select>

                  <button type="submit" id="searchButton">Search</button>
              </form>
            </div>

            <button class="signin" id="signin-header">Sign In</button>
        </header>

        <!-- Trending Movie Carousel -->
        <br>
        <center><h3>Popular Movies this Week</h3></center>
        
        <div id="trendingContainer">
          <button id="carouselLeftButton"><b><</b></button>
          <div id="trendingCarousel">

              <!-- Divs to hold each element of the image carousel -->
              <div id="trend1" class="trendElement">{{poster_urls}}</div>
              <div id="trend2" class="trendElement"></div>
              <div id="trend3" class="trendElement"></div>
              <div id="trend4" class="trendElement"></div>
              <div id="trend5" class="trendElement"></div>
              <div id="trend6" class="trendElement"></div>
              <div id="trend7" class="trendElement"></div>
              <div id="trend8" class="trendElement"></div>
              <div id="trend9" class="trendElement"></div>
  
          </div>

          <button id="carouselRightButton"><b>></b></button>
        </div>
        
        <!-- Section with Top Rated & What's New Section-->
        <div id="lower-section">
            <h3>Top Rated Movie this Week</h3>
            <h3>What's New?</h3>
            <div class="movieElement bottom" id="top-rated"></div> 
            <div class="movieElement bottom" id="whats-new"></div>
        </div>

        <center><h3>Already a user or new to the site?</h3></center>
        <center><div id="signin-or-up">
            <button class="signin" class="lower" id="loginButton2">Sign in</button>
            or 
            <button class="signup" class="lower" id="createAccountButton">Sign up</button>
        </div></center>

        
        <!-- THESE DON'T APPEAR ON THE PAGE -->
        <!-- Create Login Modal -->
        <div id="loginModal" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <h1>Login To MovieFlix</h1>
            <!-- This input tag will need to be integrated to the backend-->
            <center><p><input placeholder="Username"></input></p></center>
             
            <center><p><input placeholder="Password" type="password"></input></p></center>
            
            <br>

            <center><button>Login</button></center>
          </div>
        </div>
        
        <!-- Create Account Modal -->
        <div id="createAccountModal" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <h1>Create An Account</h1>
            <center><p><input placeholder="Email"></input></p></center>
            
            <center><p><input placeholder="Username"></input></p></center>
            
            <center><p><input placeholder="Password" type="password"></input></p></center>
            
            <center><p><input placeholder="Confirm Password" type="password"></input></p></center>
            
            <br>

            <center><button>Create Account</button>
          </div>
        </div>
        
        <footer></footer>

        <script src="{{ url_for('static', filename='trending-carousel.js') }}"></script>
        <script src="{{ url_for('static', filename='modal.js') }}"></script>
    </body>
</html>
